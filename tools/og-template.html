<!DOCTYPE html><html><head><meta charset="utf-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+SC:wght@500;700&display=swap');
  *{margin:0;padding:0;box-sizing:border-box}
  body{width:1200px;height:630px;overflow:hidden;background:#0A0E1A;font-family:"Space Grotesk","Noto Sans SC",sans-serif;position:relative}
  .grid{position:absolute;inset:0;
    background-image:linear-gradient(rgba(0,229,255,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(0,229,255,.06) 1px,transparent 1px);
    background-size:60px 60px;
    -webkit-mask-image:radial-gradient(ellipse at 30% 40%,#000 20%,transparent 78%)}
  .orb{position:absolute;border-radius:50%;filter:blur(90px)}
  .c1{width:460px;height:460px;background:radial-gradient(circle,rgba(0,229,255,.55),transparent 70%);top:-170px;left:-120px}
  .c2{width:430px;height:430px;background:radial-gradient(circle,rgba(168,85,247,.5),transparent 70%);bottom:-190px;right:-90px}
  .c3{width:300px;height:300px;background:radial-gradient(circle,rgba(245,158,11,.3),transparent 70%);bottom:60px;left:36%}
  .wrap{position:relative;padding:76px 80px;height:100%;display:flex;flex-direction:column;justify-content:center}
  .tag{display:inline-flex;align-items:center;gap:10px;font-family:"JetBrains Mono",monospace;font-size:16px;
    color:#00E5FF;background:rgba(0,229,255,.13);border:1px solid rgba(0,229,255,.28);
    padding:9px 20px;border-radius:999px;letter-spacing:.05em;width:fit-content;margin-bottom:34px}
  .tag i{width:7px;height:7px;border-radius:50%;background:#00E5FF;box-shadow:0 0 10px #00E5FF}
  h1{font-size:74px;line-height:1.1;letter-spacing:-.03em;font-weight:700;color:#E6E9F2;margin-bottom:20px}
  h1 .grad{background:linear-gradient(120deg,#00E5FF,#A855F7 55%,#F472B6);
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  p{font-size:26px;color:#9BA3B8;line-height:1.6;max-width:820px;font-weight:500}
  .foot{position:absolute;bottom:56px;left:80px;right:80px;display:flex;align-items:center;gap:20px;
    font-family:"JetBrains Mono",monospace;font-size:17px;color:#5F6980;letter-spacing:.04em}
  .foot .sep{flex:1;height:1px;background:linear-gradient(90deg,rgba(255,255,255,.18),transparent)}
  .foot b{color:#00E5FF;font-weight:500}
  .code{position:absolute;right:78px;top:50%;transform:translateY(-50%);
    font-family:"JetBrains Mono",monospace;font-size:15px;line-height:2;color:#5F6980;
    border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:26px 28px;background:rgba(255,255,255,.03)}
  .code .k{color:#A855F7}.code .c{color:#00E5FF}.code .g{color:#34D399}
</style></head><body>
<div class="grid"></div>
<div class="orb c1"></div><div class="orb c2"></div><div class="orb c3"></div>
<div class="wrap">
  <div class="tag"><i></i>AI 编程实践者 · 教普通人用 AI 做产品</div>
  <h1>用 AI 把想法<br>变成<span class="grad">能用的产品</span>。</h1>
  <p>38 篇实战文章 · 从 Cursor 到 Claude Code · 一个老码农的真实复盘</p>
</div>
<div class="code">
  <div><span class="c">➜</span> ~ ai build --idea "a product"</div>
  <div class="g">✓ Built in 47 seconds</div>
  <div><span class="c">➜</span> ~ ai ship --first-user</div>
  <div class="g">✓ 1 real user</div>
  <div><span class="c">➜</span> ~ <span class="k">▊</span></div>
</div>
<div class="foot">
  <span>muchengit.github.io</span><span class="sep"></span>
  <span>GitHub · <b>@muchengit</b></span><span class="sep"></span>
  <span>2026</span>
</div>
</body></html>
